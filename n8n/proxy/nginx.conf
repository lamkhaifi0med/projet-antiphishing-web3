worker_processes 1;
pid /tmp/nginx.pid;

events {
  worker_connections 256;
}

http {
  # Ne jamais divulguer la version nginx dans les reponses ou les logs d'erreur.
  server_tokens off;
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  client_max_body_size 16k;
  client_body_timeout 10s;
  client_header_timeout 10s;

  # RF-S4 : seul le webhook public /report et la lecture publique WF4
  # /check traversent ce proxy. L'editeur n8n (/, /rest/*, /webhook-test/*,
  # /assets/*) n'est jamais accessible par ce port - uniquement en direct
  # sur 127.0.0.1:5678 pour l'administration locale.
  server {
    listen 8080;

    # Resolveur DNS embarque de Docker Compose. Utiliser une variable dans
    # proxy_pass force nginx a resoudre "n8n" a chaque requete plutot qu'une
    # seule fois au demarrage : le proxy ne tombe pas si n8n redemarre ou
    # n'est pas encore resolvable au moment ou nginx charge sa config.
    resolver 127.0.0.11 valid=10s;

    # Sonde de conteneur uniquement : ne verifie que nginx lui-meme, jamais
    # n8n (evite de confondre un backend indisponible avec un proxy mort).
    location = /healthz {
      return 200 "ok";
      add_header Content-Type text/plain always;
    }

    location = /webhook/report {
      limit_except POST { deny all; }
      set $upstream http://n8n:5678;
      proxy_pass $upstream/webhook/report;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 15s;
    }

    location = /webhook/check {
      limit_except GET { deny all; }
      set $upstream http://n8n:5678;
      proxy_pass $upstream/webhook/check$is_args$args;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      # Une verification interroge la blockchain (eth_call + enrichissement
      # txHash borne a 3s) a travers WF4 : plus lent qu'un simple proxy.
      proxy_read_timeout 30s;
    }

    # Flux public d'activite recente du portail : lecture seule, champs
    # deja publics (voir bridge/server.js). GET uniquement.
    location = /api/recent {
      limit_except GET { deny all; }
      set $bridge http://bridge:8787;
      proxy_pass $bridge/reports/recent;
      proxy_read_timeout 10s;
    }

    # Portail statique : page unique de verification/signalement. Aucun
    # acces a l'editeur n8n via ce port (RF-S4 inchange : seuls /webhook/*
    # et /api/recent traversent le proxy).
    location = / {
      root /usr/share/nginx/html;
      try_files /index.html =404;
      add_header Cache-Control "no-cache" always;
    }

    location / {
      return 403;
    }
  }
}
