# Déploiement n8n local (Phase 0 du plan Profil B — RF-S4, DP-7).
# Self-hosted, local uniquement, gratuit. Pas de workflow ici : infrastructure seulement.
#
# Démarrage (depuis ce dossier) :
#   docker compose up -d
# Les variables sont lues automatiquement depuis n8n/.env (voir n8n/README.md).

services:
  n8n:
    # Version utilisée pour valider les imports WF3/WF4 (RNF-4).
    image: n8nio/n8n:2.32.7
    container_name: anti-phishing-n8n
    restart: unless-stopped
    ports:
      # Lié à 127.0.0.1 uniquement : jamais 0.0.0.0, n8n ne doit pas être
      # joignable depuis le réseau local ou Internet (RF-S4).
      - "127.0.0.1:5678:5678"
    environment:
      # Échoue bruyamment au démarrage si la clé n'est pas définie, plutôt
      # que de démarrer avec une clé vide (n8n en générerait une aléatoire
      # et rendrait illisibles les credentials déjà enregistrés au redémarrage
      # suivant).
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?manquante - voir n8n/README.md}
      - GENERIC_TIMEZONE=Africa/Casablanca
      - TZ=Africa/Casablanca
      # Télémétrie / diagnostics désactivés.
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_HIRING_BANNER_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      # URL interne uniquement. Le token reste dans un credential Header Auth
      # n8n chiffré ; il n'est jamais exporté dans les workflows JSON.
      - CHAIN_BRIDGE_URL=http://chain-bridge:3001
    depends_on:
      chain-bridge:
        condition: service_healthy
    volumes:
      # Volume nommé : persiste la base interne n8n (workflows, credentials
      # chiffrés, exécutions) entre deux redémarrages du conteneur.
      - n8n_data:/home/node/.n8n
      # Chemin séparé (pas imbriqué sous /home/node/.n8n, qui est déjà le
      # point de montage du volume nommé) pour l'export manuel des workflows
      # en JSON à versionner — évite les refus de permission que provoque
      # souvent un bind mount Windows imbriqué dans un volume nommé sur
      # Docker Desktop.
      - ./workflows:/export

  chain-bridge:
    build:
      context: ..
      dockerfile: n8n/services/chain-bridge/Dockerfile
    container_name: anti-phishing-chain-bridge
    restart: unless-stopped
    init: true
    # Aucun port publié : seul n8n peut joindre ce service sur le réseau
    # Compose. Le bridge doit conserver un accès sortant vers le RPC Amoy.
    expose:
      - "3001"
    environment:
      - CHAIN_BRIDGE_HOST=0.0.0.0
      - CHAIN_BRIDGE_PORT=3001
      - CHAIN_BRIDGE_TOKEN=${CHAIN_BRIDGE_TOKEN:?manquante - voir n8n/README.md}
      - WF3_LIFECYCLE_DB_PATH=/var/lib/chain-bridge/wf3-lifecycle.sqlite
      - AMOY_RPC_URL=${AMOY_RPC_URL:?manquante - voir n8n/README.md}
      - REGISTRY_CONTRACT_ADDRESS=${REGISTRY_CONTRACT_ADDRESS:?manquante - voir n8n/README.md}
      - REGISTRY_DEPLOYMENT_BLOCK=${REGISTRY_DEPLOYMENT_BLOCK:?manquante - voir n8n/README.md}
      # Clé Reporter seulement. OWNER_PRIVATE_KEY n'est ni injectée ni montée.
      - REPORTER_PRIVATE_KEY=${REPORTER_PRIVATE_KEY:?manquante - voir n8n/README.md}
    read_only: true
    volumes:
      # Seul emplacement persistant et inscriptible du bridge. SQLite y
      # applique le compare-and-swap des cycles de vie WF3.
      - chain_bridge_state:/var/lib/chain-bridge
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  n8n_data:
    name: anti_phishing_n8n_data
  chain_bridge_state:
    name: anti_phishing_chain_bridge_state
