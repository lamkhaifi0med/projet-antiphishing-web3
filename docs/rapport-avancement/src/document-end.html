<script>
  (() => {
    const params = new URLSearchParams(window.location.search);
    if (params.get("audit") === "1") {
      const layout = [...document.querySelectorAll(".page")].map((page) => {
        const pageRect = page.getBoundingClientRect();
        const folio = page.querySelector(":scope > .folio");
        const contentChildren = [...page.children].filter(
          (element) =>
            !element.classList.contains("folio") &&
            !element.classList.contains("cover-grid") &&
            !element.classList.contains("cover-orb"),
        );
        const contentBottom = Math.max(
          pageRect.top,
          ...contentChildren.map((element) => element.getBoundingClientRect().bottom),
        );
        const folioTop = folio ? folio.getBoundingClientRect().top : pageRect.bottom;
        return {
          page: Number(page.dataset.page),
          clientHeight: page.clientHeight,
          scrollHeight: page.scrollHeight,
          pageOverflow: page.scrollHeight > page.clientHeight + 1,
          contentFolioOverlap: Boolean(folio) && contentBottom > folioTop - 2,
          clearancePx: Math.round((folioTop - contentBottom) * 10) / 10,
        };
      });
      document.body.innerHTML = `<pre id="layout-audit">${JSON.stringify(layout)}</pre>`;
      return;
    }

    const selected = params.get("page");
    if (!selected) return;
    const page = document.querySelector(`[data-page="${selected}"]`);
    if (!page) return;
    document.body.classList.add("single-page");
    page.classList.add("selected-page");
  })();
</script>
</body>
</html>
